spring.application.name=banking-system

# JPA
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.open-in-view=false



# APP CONFIG
# ADMIN
admin.username=${APP_ADMIN_USERNAME}
admin.password=${APP_ADMIN_PASSWORD}

# SYSTEM
system.account.id=SYS-EXTERNAL

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=600000

#REFRESH TOKEN
refresh.token.expiration=21600000

# OTHERS
starting.bonus.value=1000

# FRONTEND
frontend.url=${FRONTEND_URL}

# REDIS
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# MACOS DNS WARNING SUPPRESS
logging.level.io.netty.resolver.dns.DnsServerAddressStreamProviders=ERROR

# SUPPRESS SPRING AUTOGENERATED ACCOUNT
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration


logging.level.org.springframework.web=DEBUG
